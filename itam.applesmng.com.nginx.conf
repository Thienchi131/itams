map $http_cf_connecting_ip $limit_key {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

limit_req_zone $limit_key zone=itams_req:10m rate=60r/s;
limit_conn_zone $limit_key zone=itams_conn:10m;

server {
    server_name itam.applesmng.com;

    client_max_body_size 25m;

    limit_req zone=itams_req burst=120 nodelay;
    limit_conn itams_conn 60;

    # HSTS: ép trình duyệt chỉ dùng HTTPS cho itam trong 1 năm. CỐ Ý KHÔNG
    # dùng includeSubDomains/preload vì sẽ áp sang các subdomain khác
    # (ep/supbot/monitor/n8n...) — có cái chưa chắc đã HTTPS sạch, bật nhầm sẽ
    # tự chặn chính các subdomain đó. Chỉ gửi trên 443 (block dưới redirect 80).
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $limit_key;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/itam.applesmng.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itam.applesmng.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name itam.applesmng.com;

    # Cổng 80: ép toàn bộ lên HTTPS (tránh cửa sổ SSL-stripping ở lần truy cập
    # đầu). Cert là wildcard cấp qua DNS-01 nên không cần giữ location
    # /.well-known/acme-challenge ở đây; nếu sau này đổi sang HTTP-01 thì thêm
    # location đó TRƯỚC dòng redirect.
    return 301 https://$host$request_uri;
}
