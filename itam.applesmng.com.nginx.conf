# Giới hạn tốc độ request VÀ số kết nối đồng thời — theo IP THẬT của người
# dùng cuối, không phải IP của Cloudflare (web luôn chạy sau Cloudflare proxy,
# nên $remote_addr ở Nginx luôn là IP edge của Cloudflare, KHÔNG PHẢI IP thật
# — dùng thẳng $remote_addr từng khiến TOÀN BỘ người dùng thật bị gộp chung
# vào 1 giới hạn duy nhất, chỉ vài người dùng cùng lúc đã vượt ngưỡng, gây
# chậm/rớt request hàng loạt — sự cố thực tế đã gặp).
#
# Cloudflare luôn gửi kèm header "CF-Connecting-IP" = IP THẬT của khách truy
# cập — dùng header này làm khoá thay vì $remote_addr. map thêm phương án dự
# phòng: nếu vì lý do gì đó header này trống (VD ai đó lỡ mở lại port 443 cho
# ngoài Cloudflare sau này), rơi về $remote_addr như cũ thay vì để trống gây
# lỗi cấu hình.
map $http_cf_connecting_ip $limit_key {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# rate=60r/s + burst=120 nodelay: RỘNG RÃI cho 1 người dùng thật — trang danh
# sách của app này dùng React Server Components, mỗi lần chuyển trang có thể
# bắn ra 10-20 request gần như cùng lúc (đã thấy thực tế trong access.log).
# Vẫn đủ chặn được kiểu 1 IP dội hàng trăm request/giây liên tục.
limit_req_zone $limit_key zone=itams_req:10m rate=60r/s;
limit_conn_zone $limit_key zone=itams_conn:10m;

server {
    server_name itam.applesmng.com;

    # Giới hạn dung lượng file upload (VD Import Excel) — mặc định Nginx chỉ
    # cho 1MB, sẽ tự chặn (413) TRƯỚC KHI tới app. Đặt lớn hơn 1 chút so với
    # giới hạn 20MB đã thêm ở code app, để lỗi báo đúng chỗ (app báo lỗi rõ
    # ràng bằng tiếng Việt) thay vì Nginx chặn thẳng bằng trang lỗi 413 trắng.
    client_max_body_size 25m;

    limit_req zone=itams_req burst=120 nodelay;
    limit_conn itams_conn 60;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Đủ thời gian cho các thao tác chậm hợp lý (import file lớn, query
        # nặng) nhưng không giữ kết nối treo vô hạn khi app bị đứng — tránh
        # tình trạng 1 request hỏng chiếm mãi 1 worker connection.
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Tăng buffer đọc header phản hồi từ app — phòng thêm 1 lớp (ngoài
        # phần đã giới hạn ở code) cho các trường hợp response header lớn bất
        # ngờ, tránh lỗi "upstream sent too big header".
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/itam.applesmng.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itam.applesmng.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name itam.applesmng.com;

    client_max_body_size 25m;
    limit_req zone=itams_req burst=120 nodelay;
    limit_conn itams_conn 60;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
